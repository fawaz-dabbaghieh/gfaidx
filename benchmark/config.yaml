# Configuration for the gfaidx / vg / odgi / gbz-base benchmark.
#
# Manifest paths are resolved next to the Snakefile. Graph paths in graphs.tsv
# are resolved against data_root unless they are absolute.

data_root: /path/to/genome_graphs
results_dir: results

graphs_tsv: graphs.tsv
loci_tsv: loci.tsv

# Fixed thread count for indexing and untimed setup operations.
threads: 1

# Query-level thread sweep. gfaidx and ODGI node queries, plus threaded region
# queries, use every value. VG find and gbz-base node queries are measured once
# because those commands expose no query-thread option.
query_threads: [1, 2, 4, 8]

# Region-only local haplotype sweep. Values are bases and are passed explicitly
# to gfaidx --haplotype_gap and ODGI --max-distance-subpaths.
haplotype_gaps_bp: [50000, 100000, 200000, 500000]

# ODGI can repeatedly merge nearby subpaths. Keep one iteration, the currently
# documented default of three, and a larger six-iteration setting.
odgi_merging_iterations: [1, 3, 6]

# Keep the two tool-specific non-numeric baselines as separate query variants.
include_gfaidx_no_gap: true
include_odgi_default: true

# Node-neighborhood context sweeps.
#
# node_contexts_steps: context as a number of expansion steps (vg find -c, odgi -c).
# node_contexts_bases: context as a base-pair budget (vg find -c -L, odgi -L,
#   gbz-base --context). This second track exists because gbz-base only
#   expresses context in bp.
#
# gfaidx has neither semantics: it bounds a BFS by node count, so for every
# (query, context, source tool) the workflow reruns gfaidx with --max_nodes set
# to the node count that source tool produced.
node_contexts_steps: [1, 10, 100, 1000, 5000, 10000]
node_contexts_bases: [1000, 10000, 100000, 1000000, 5000000, 10000000]

# Process-tree RSS sampling interval in seconds.
sample_interval_seconds: 0.05

tools:
  # Point this at the native gfaidx executable to benchmark. It may also be a
  # command available on PATH.
  gfaidx: gfaidx
  vg: vg
  odgi: odgi
  gbz_base: gbz-base
  python: python3

gfaidx:
  # Chunking parameters from the project notes.
  index_extra: "--progress_every 0 --checkpoint_steps 1024 --max_chunk_nodes 10000 --min_chunk_nodes 1000"
  coordinate_extra: "--progress_every 0"
  # Required query semantics are added by the Snakefile: node queries always
  # use --with_coords and --max_nodes, while interval queries always use
  # --with_coords and --all_haplotypes.
  get_subgraph_extra: ""
  get_region_extra: ""

vg:
  convert_extra: ""
  # Applied only to node-seeded extraction with vg find.
  find_extra: ""
  # Applied only to path-coordinate extraction with vg chunk.
  chunk_extra: ""

odgi:
  build_extra: ""
  pathindex_extra: ""
  stepindex_extra: ""
  extract_extra: ""

gbz:
  # --max-node 0 disables GBZ segment chopping. Default chopping adds nodes
  # and renumbers the ID space, so `gbz-base query --node <original id>` can
  # fail because that input handle no longer exists. Disabling chopping keeps
  # the input IDs usable across VG, gbz-base, and gfaidx node queries.
  #
  # If you need a default-chopped GBZ instead, add `--translation FILE` to dump
  # the segment-to-node table and translate query nodes through it.
  gbwt_extra: "--max-node 0"
  construct_extra: ""
  query_extra: ""
